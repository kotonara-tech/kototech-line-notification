name: apply-to-dev

# dev のインフラ(Terraform)だけを、手動で適用する。アプリのデプロイや QA は行わない。
# 任意のブランチから実行できる(Workload Identity の条件は、dev ではブランチを制限しない)。
on:
  workflow_dispatch:
    inputs:
      apply:
        description: false にすると plan だけを実行する(apply しない)
        type: boolean
        default: true
      allow_destroy:
        description: true にすると、削除(作り直しを含む)がある計画でも apply する。false(既定)では、1 件でもあれば apply を止める
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  infra:
    uses: ./.github/workflows/reusable-infra-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      apply: ${{ inputs.apply }}
      allow_destroy: ${{ inputs.allow_destroy }}
