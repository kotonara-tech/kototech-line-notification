name: apply-to-prod

# prod のインフラ(Terraform)だけを、手動で適用する。アプリのデプロイや QA は行わない。
# main 以外は拒否する(Workload Identity の条件でも、refs/heads/main 以外の認証は拒否される)。
# GitHub の Environment `prod` に Required reviewers を設定して、承認を挟む。
on:
  workflow_dispatch:
    inputs:
      apply:
        description: false にすると plan だけを実行する(apply しない)
        type: boolean
        default: true
      allow_destroy:
        description: true にすると、削除(作り直しを含む)がある計画でも apply する。false(既定)では、1 件でもあれば apply を止める
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  infra:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-infra-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
      apply: ${{ inputs.apply }}
      allow_destroy: ${{ inputs.allow_destroy }}
