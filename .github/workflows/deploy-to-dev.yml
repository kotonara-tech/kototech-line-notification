name: deploy-to-dev

on:
  push:
    branches: [develop]
  workflow_dispatch: # 任意のブランチから dev へ手動デプロイできる

permissions:
  contents: read

jobs:
  qa:
    uses: ./.github/workflows/reusable-qa.yml
    permissions:
      contents: read
      id-token: write
    with:
      run-integration: true
      integration-environment: dev

  # Job 本体(Terraform 管理)が存在する状態でイメージを更新するため、インフラを先に適用する
  infra:
    needs: qa
    uses: ./.github/workflows/reusable-infra-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev

  deploy:
    needs: infra
    uses: ./.github/workflows/reusable-deploy-backend.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
