name: deploy-to-prod

# prod へのデプロイは、手動起動のみ(push では起動しない)。main へのマージのあとに、最新の main の先頭の SHA を入力して起動する。
#   gh workflow run deploy-to-prod.yml --ref main -f sha=<最新の main の SHA>
# 最初のジョブ guard が、入力が最新の main と一致しないとき(古い SHA・短い SHA・main 以外など)に失敗し、以降のジョブを動かさない。
# 続くジョブは、起動したコミット(github.sha)をデプロイする。guard が、それが入力した SHA と同じであることを確かめる。
# 同じになる理由と、成り立たなくなる場合は、docs/engineering/02-infra.md の「CD」。
# Workload Identity の条件で refs/heads/main 以外は認証が拒否される。
# GitHub の Environment `prod` に Required reviewers を設定して承認を挟む。
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 最新の main の先頭のコミットの SHA(40 桁の 16 進)。一致しないと失敗する
        type: string
        required: true

permissions:
  contents: read

jobs:
  # 最初に動く。失敗すると、qa・infra・deploy は動かない
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # ローカル action を読むためだけの取得。git の認証情報は残さない

      - uses: ./.github/actions/check-main-sha
        with:
          sha: ${{ inputs.sha }}

  qa:
    needs: guard
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-qa.yml

  # Job 本体(Terraform 管理)が存在する状態でイメージを更新するため、インフラを先に適用する
  infra:
    needs: qa
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-infra-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
      check_release_source: true

  deploy:
    needs: infra
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-deploy-backend.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
