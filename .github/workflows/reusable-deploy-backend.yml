name: reusable-deploy-backend

on:
  workflow_call:
    inputs:
      environment:
        description: デプロイ先の GitHub Environment(dev / prod)。接続情報は Environment の variables から読む
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-backend-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      REGION: ${{ vars.REGION }}
      JOB_NAME: ${{ vars.CLOUD_RUN_JOB_NAME }}
      IMAGE: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY_URL }}/notifier:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # バイナリは 1 つ。役割は環境変数(ROLE)で切り替わるため、イメージも 1 つ
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Job 本体と環境変数は Terraform が管理しているため、イメージだけを更新する
      - name: Update Cloud Run Job image
        run: |
          gcloud run jobs update "$JOB_NAME" \
            --image "$IMAGE" \
            --region "$REGION"
