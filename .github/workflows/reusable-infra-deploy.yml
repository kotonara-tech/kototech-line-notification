name: reusable-infra-deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 対象の GitHub Environment 兼 Terraform の環境ディレクトリ名(dev / prod)
        type: string
        required: true
      apply:
        description: false なら plan のみ実行する
        type: boolean
        default: true
      allow_destroy:
        description: 削除(作り直しを含む)がある計画でも apply する。false(既定)では、1 件でもあれば apply を止める
        type: boolean
        default: false
      check_release_source:
        description: true なら、デプロイするコミットが develop で検証済みのものかを、認証の前に検査する。満たさない、または取得に失敗したときは、失敗して先へ進まない(prod のデプロイ用。既定は false)
        type: boolean
        default: false

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.15.7

jobs:
  terraform:
    name: terraform (plan${{ inputs.apply && ' / apply' || '' }})
    runs-on: ubuntu-latest
    # Environment の指定は、その variables(vars.*)を読むために必要。dev も prod も、承認者は設定していない(承認を待たない。D36)
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    # state のロックがあるが、apply は途中で中断させない
    concurrency:
      group: infra-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform/env/${{ inputs.environment }}
    env:
      # env/*/variables.tf の変数。tfvars はコミットしないため、Environment の variables から渡す
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.REGION || 'asia-northeast1' }}
      TF_VAR_spreadsheet_id: ${{ vars.SPREADSHEET_ID }}
      TF_VAR_line_channel_id: ${{ vars.LINE_CHANNEL_ID }}
      TF_VAR_notify_lead_minutes: ${{ vars.NOTIFY_LEAD_MINUTES || '10' }}
      # 初回デプロイ前は Job のイメージが placeholder のため、Scheduler を止めておく(既定)
      TF_VAR_scheduler_paused: ${{ vars.SCHEDULER_PAUSED || 'true' }}
    steps:
      - uses: actions/checkout@v4

      # 変数の値の前後に空白がないかを、最初に確認する(ローカル action は、リポジトリの取得後でないと見つからない)
      - uses: ./.github/actions/check-vars
        with:
          vars-json: ${{ toJSON(vars) }}

      # prod のデプロイ(check_release_source: true)だけ。デプロイするコミットが develop で検証済みのものかを、認証より前に検査する。
      # 呼び出し元の github.sha(デプロイを起動したコミット)を見る。取得に失敗したときも失敗する(通さない)。
      # apply-to-* は、復旧に使うため、検査しない。この検査は、呼び出し元の guard と qa のあとの、このジョブの中で動く(Environment の承認は待たない。D36)
      - name: リリース元を検査する
        if: inputs.check_release_source
        uses: ./.github/actions/check-release-source
        with:
          mode: deploy
          sha: ${{ github.sha }}
          token: ${{ github.token }}

      # 認証情報は ADC として扱われる(GOOGLE_APPLICATION_CREDENTIALS)。
      # Terraform の google provider と GCS backend の両方がこれを使う
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - run: terraform init -input=false

      - run: terraform validate

      - name: plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      # plan に、実際の変更があるかを、保存した plan のファイルから機械的に判定する。
      # コミットのメッセージなど、人が書くものには頼らない(書き忘れや誤記で、判定が狂わないため)。
      # 変更がなければ、apply は何もしないので、飛ばす。変更に数えるのは、リソースの作成・更新・削除・作り直しと、出力の変更。
      # data の読み取り(read)と、変更なし(no-op)は、数えない。読めないときは、止める(変更なしと見なさない)
      - name: 変更の有無を判定する
        id: changes
        run: |
          set -euo pipefail
          plan_json="$(terraform show -json tfplan)"
          printf '%s' "$plan_json" | jq -e '.format_version' > /dev/null || { echo '::error::terraform show -json の出力を読めないため、変更の有無を判定できない'; exit 1; }
          count="$(printf '%s' "$plan_json" | jq '([(.resource_changes // [])[] | select(any(.change.actions[]; . != "no-op" and . != "read"))] | length) + ([(.output_changes // {}) | to_entries[] | select(any(.value.actions[]; . != "no-op"))] | length)')"
          if [ "$count" -gt 0 ]; then
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
            echo "### インフラ(${{ inputs.environment }}): 変更 ${count} 件" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo "### インフラ(${{ inputs.environment }}): plan に変更がないため、apply を飛ばす" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: plan summary
        run: |
          {
            echo '### terraform plan (${{ inputs.environment }})'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 削除(replace を含む)がある計画は、allow_destroy が true のときだけ apply に進める。
      # Environment prod は承認を待たず(D36)、plan を見る機会がないまま apply に進むため、この検査が止め役になる。
      # plan の JSON には機密の値が含まれうるため、ファイルに残さず、リソースのアドレスとアクションだけを出力する
      - name: destroy guard
        env:
          APPLY: ${{ inputs.apply }}
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
        run: |
          set -euo pipefail
          plan_json="$(terraform show -json tfplan)"
          # 空や壊れた出力のまま、削除なしと判定して通さない
          printf '%s' "$plan_json" | jq -e '.format_version' > /dev/null || { echo '::error::terraform show -json の出力を読めないため、apply を止めた'; exit 1; }
          # actions に delete を含むものが、削除と replace(delete と create の組)。resource_changes が無い計画は 0 件
          changes="$(printf '%s' "$plan_json" | jq -c '[(.resource_changes // [])[] | select(any(.change.actions[]; . == "delete")) | {address, actions: .change.actions}]')"
          count="$(printf '%s' "$changes" | jq 'length')"

          if [ "$count" -eq 0 ]; then
            echo '削除を含む変更: なし' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### 削除を含む変更: ${count} 件"
            echo
            echo '`delete` は削除、`delete` と `create` の組は作り直し(replace)。'
            echo
            echo '| リソース | アクション |'
            echo '| --- | --- |'
            printf '%s' "$changes" | jq -r '.[] | "| `\(.address)` | \(.actions | join(", ")) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$APPLY" = 'false' ]; then
            echo "::warning::削除を含む変更が ${count} 件ある(plan のみのため、apply はしない)"
          elif [ "$ALLOW_DESTROY" = 'true' ]; then
            echo "::warning::削除を含む変更が ${count} 件ある。allow_destroy が true のため、apply に進む"
          else
            echo "::error::削除を含む変更が ${count} 件ある。allow_destroy が false のため、apply を止めた。一覧はステップサマリを確認する"
            exit 1
          fi

      # plan で確認した内容をそのまま適用する
      - name: apply
        if: inputs.apply && steps.changes.outputs.has_changes == 'true'
        run: terraform apply -input=false -lock-timeout=5m tfplan
