name: reusable-infra-deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 対象の GitHub Environment 兼 Terraform の環境ディレクトリ名(dev / prod)
        type: string
        required: true
      apply:
        description: false なら plan のみ実行する
        type: boolean
        default: true
      allow_destroy:
        description: 削除(作り直しを含む)がある計画でも apply する。false(既定)では、1 件でもあれば apply を止める
        type: boolean
        default: false

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.15.7

jobs:
  terraform:
    name: terraform (plan${{ inputs.apply && ' / apply' || '' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    # state のロックがあるが、apply は途中で中断させない
    concurrency:
      group: infra-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform/env/${{ inputs.environment }}
    env:
      # env/*/variables.tf の変数。tfvars はコミットしないため、Environment の variables から渡す
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.REGION || 'asia-northeast1' }}
      TF_VAR_spreadsheet_id: ${{ vars.SPREADSHEET_ID }}
      TF_VAR_line_channel_id: ${{ vars.LINE_CHANNEL_ID }}
      TF_VAR_notify_lead_minutes: ${{ vars.NOTIFY_LEAD_MINUTES || '10' }}
      # 初回デプロイ前は Job のイメージが placeholder のため、Scheduler を止めておく(既定)
      TF_VAR_scheduler_paused: ${{ vars.SCHEDULER_PAUSED || 'true' }}
    steps:
      - uses: actions/checkout@v4

      # 変数の値の前後に空白がないかを、最初に確認する(ローカル action は、リポジトリの取得後でないと見つからない)
      - uses: ./.github/actions/check-vars
        with:
          vars-json: ${{ toJSON(vars) }}

      # 認証情報は ADC として扱われる(GOOGLE_APPLICATION_CREDENTIALS)。
      # Terraform の google provider と GCS backend の両方がこれを使う
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - run: terraform init -input=false

      - run: terraform validate

      - name: plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: plan summary
        run: |
          {
            echo '### terraform plan (${{ inputs.environment }})'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 削除(replace を含む)がある計画は、allow_destroy が true のときだけ apply に進める。
      # Environment の承認はジョブの開始時に求められ、plan を見る前になるため、この検査が止め役になる。
      # plan の JSON には機密の値が含まれうるため、ファイルに残さず、リソースのアドレスとアクションだけを出力する
      - name: destroy guard
        env:
          APPLY: ${{ inputs.apply }}
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
        run: |
          set -euo pipefail
          plan_json="$(terraform show -json tfplan)"
          # 空や壊れた出力のまま、削除なしと判定して通さない
          printf '%s' "$plan_json" | jq -e '.format_version' > /dev/null || { echo '::error::terraform show -json の出力を読めないため、apply を止めた'; exit 1; }
          # actions に delete を含むものが、削除と replace(delete と create の組)。resource_changes が無い計画は 0 件
          changes="$(printf '%s' "$plan_json" | jq -c '[(.resource_changes // [])[] | select(any(.change.actions[]; . == "delete")) | {address, actions: .change.actions}]')"
          count="$(printf '%s' "$changes" | jq 'length')"

          if [ "$count" -eq 0 ]; then
            echo '削除を含む変更: なし' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### 削除を含む変更: ${count} 件"
            echo
            echo '`delete` は削除、`delete` と `create` の組は作り直し(replace)。'
            echo
            echo '| リソース | アクション |'
            echo '| --- | --- |'
            printf '%s' "$changes" | jq -r '.[] | "| `\(.address)` | \(.actions | join(", ")) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$APPLY" = 'false' ]; then
            echo "::warning::削除を含む変更が ${count} 件ある(plan のみのため、apply はしない)"
          elif [ "$ALLOW_DESTROY" = 'true' ]; then
            echo "::warning::削除を含む変更が ${count} 件ある。allow_destroy が true のため、apply に進む"
          else
            echo "::error::削除を含む変更が ${count} 件ある。allow_destroy が false のため、apply を止めた。一覧はステップサマリを確認する"
            exit 1
          fi

      # plan で確認した内容をそのまま適用する
      - name: apply
        if: inputs.apply
        run: terraform apply -input=false -lock-timeout=5m tfplan
