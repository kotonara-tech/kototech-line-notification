name: reusable-qa

on:
  workflow_call:

permissions:
  contents: read

env:
  # backend/go.mod の Go バージョンを上げるときは、それを解析できるバージョンに更新する
  # (古い golangci-lint は、新しい Go のコードを解析できず lint が失敗する)
  GOLANGCI_LINT_VERSION: v2.13.2
  TERRAFORM_VERSION: 1.15.7

jobs:
  backend:
    name: backend (test / lint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - run: make test
      - run: make lint
      - run: make build

  terraform:
    name: terraform (fmt / validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: fmt
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: validate
        run: |
          for dir in bootstrap env/dev env/prod; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
        working-directory: infra/terraform

  # ドキュメントと yml の簡単な検査(ローカルの make verify と同じもの)
  docs:
    name: docs / yml (verify.mjs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/verify.mjs
